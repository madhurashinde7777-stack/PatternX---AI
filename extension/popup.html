<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>PatternX AI</title>
    <style>
      body {
        width: 280px;
        font-family: -apple-system, Segoe UI, sans-serif;
        margin: 0;
        padding: 16px;
        color: #1a1a1a;
      }
      h1 {
        font-size: 15px;
        margin: 0 0 12px;
      }
      .score {
        font-size: 32px;
        font-weight: 700;
      }
      .score-label {
        font-size: 12px;
        color: #666;
        margin-bottom: 12px;
      }
      .flag {
        padding: 8px;
        border-radius: 6px;
        background: #fff3e0;
        margin-bottom: 6px;
        font-size: 12px;
      }
      .flag b {
        display: block;
        font-size: 12px;
        margin-bottom: 2px;
      }
      button {
        width: 100%;
        padding: 8px;
        border: none;
        border-radius: 6px;
        background: #1a73e8;
        color: white;
        font-size: 13px;
        cursor: pointer;
        margin-top: 8px;
      }
      #empty {
        font-size: 12px;
        color: #888;
      }
    </style>
  </head>
  <body>
    <h1>PatternX AI</h1>
    <div class="score" id="score">--</div>
    <div class="score-label">Safety Score</div>
    <div id="flags"></div>
    <div id="empty">No scan yet for this tab. Click rescan.</div>
    <button id="rescan">Rescan this page</button>
    <script src="popup.js"></script>
  </body>
</html>
